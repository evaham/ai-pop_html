
<!DOCTYPE html>

<html>
<head>
  <meta charset="utf-8" />
  <title>탭 스타일</title>
  <!-- 기존 reset.css, stylesheet.css -->
  <!-- <link rel="stylesheet" href="tab_style copy.css" /> -->
  <!-- <link rel="stylesheet" href="tab_style.css" /> -->
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
.main-menu {display: flex; min-width: 1900px; border-bottom: 1px solid #e5e7eb; background-color: #ffffff; height: 56px; position: sticky; top: 0; z-index: 10; align-items: center; justify-content: space-between; padding-left: 16px; padding-right: 16px;}
.main-menu > .main-tabouter {position: relative; display: flex; align-items: center; height: 100%;}
.main-menu > .main-tabouter > ul {display: flex; align-items: center; justify-content: center; gap:2px; margin:0; padding:4px; margin-right: 8px; list-style:none}
.main-menu > .main-tabouter > ul > li { display: flex; align-items: center; justify-content: center; padding: 0; list-style:none}
.main-menu > .main-tabouter > ul > li > a {display: flex; align-items: center; justify-content: center; padding: 4px 8px; border-radius: 4px; color: #ffffff; text-decoration: none; font-size: 16px; font-weight: 500; transition: background-color 0.3s ease; outline: none; cursor: pointer;}
.main-menu > .main-tabouter > ul > li > a:hover {background-color: rgba(255, 255, 255, 0.2); text-decoration: none;}
.main-menu > .main-tabouter > ul > li.active > a {background-color: #ffffff; color: #26499d; font-weight: bold; text-decoration: none;}
.main-menu > .main-tabouter > ul > li > a > svg {margin-right:4px; font-weight: normal !important; opacity: 0.9;}
.menu-group1, .menu-group2, .menu-group3 { border-radius: 6px; background:#26499d }

.side-btn-group {display: flex; align-items: center;}
.side-btn-group ul {display: flex; gap: 4px; margin: 0; padding: 0; list-style: none;}
.side-btn-group ul li a {display: flex; align-items: center; justify-content: center; border: 1px solid #d1d5db; border-radius: 4px; font-size: 14px; color: #4b5563; padding: 4px 8px; text-decoration: none; transition: background-color 0.3s ease, color 0.3s ease; cursor: pointer;}
.side-btn-group ul li a svg {margin-right: 4px; opacity: 0.9;}
.side-btn-group ul li a:hover {background-color: #f3f4f6; color: #111827; text-decoration: none;}

/* 1. iframe 이중 스크롤 방지 */
.iframe-box { width: 100%; height: 100%; min-width: 1900px; height: calc(100dvh - 72px); border: none; }
@media (min-width: 1900px) {
  .iframe-box {
    height: calc(100dvh - 56px);
  }
}
/* 2. 작은 화면일 때 (예: 창 너비가 768px 이하로 줄어들 때) */
@media (max-width: 768px) {
  .inner-scroll-box {
    max-height: none;   /* 높이 제한을 없애서 내용을 아래로 쭉 펼침 */
    overflow-y: visible; /* 내부 스크롤바를 없앰 */
  }
}
</style>
</head>
<body>
  <form>
    <div id="tabMenu2" class="main-menu">
      <div id="ulTopMenu2" class="main-tabouter">
        <ul class="menu-group1">
          <li><a>일반문자</a></li>
          <li><a>RCS</a></li>
          <li><a>친구톡</a></li>
          <li><a>알림톡</a></li>
          <li><a>푸시메세지</a></li>
        </ul>
        <ul class="menu-group2">
          <li><a>모바일전단</a></li>
          <li class="active"><a>AI POP</a></li>
          <li><a>이미지클라우드</a></li>
        </ul>
        <ul class="menu-group3">
          <li><a>주문기능</a></li>
          <li><a>공동구매</a></li>
        </ul>
      </div>
      <div class="side-btn-group">
        <ul>
            <li><a>온라인매뉴얼</a></li>
            <li><a>충전안내</a></li>
            <li><a>레포트</a></li>
        </ul>
      </div>
    </div>
    <!-- 기존 wrap_top -->
    <div class="new-wrap_top">
      <div class="tabcontents">
        <div data-tab-content="ai-pop">
          <iframe class="iframe-box" src="./test-cloud/aiPop/airequest_pop.html"  title="AI-POP 페이지">
          </iframe>        
        </div>
      </div>
    </div>
  </form>
</body>
