    <script type="text/javascript">
        CommonController.fnShowLoading = function (msg) {
            var progView = new ProgressView();
            if (msg.length > 0) {
                progView.setMsg(msg);
            } else {
                progView.setMsg('...잠시만 기다려주세요.');
            }
            progView.showProgress();
        }
        CommonController.fnHideLoading = function () {
            var progView = new ProgressView();
            progView.hideProgress();
        }
        var ProgressView = function () {
            this.divLoading = $(".divLoading");
            this.loadingMsg = $(".divLoading em");
        }
        ProgressView.prototype = {
            showProgress: function () {
                this.divLoading.show();
            }, hideProgress: function () {
                this.divLoading.hide();
            }, setMsg: function (msg) {
                this.loadingMsg.html(msg);
            }
        }
    </script>

    <script type="text/javascript">
        CommonController.fnRedirect = function (url, postData) {
            function post(path, params, method) {
                method = method || "post"; // Set method to post by default if not specified.

                // The rest of this code assumes you are not using a library.
                // It can be made less wordy if you use one.
                var form = document.createElement("form");
                form.setAttribute("method", method);
                form.setAttribute("action", path);

                for (var key in params) {
                    if (params.hasOwnProperty(key)) {
                        var hiddenField = document.createElement("input");
                        hiddenField.setAttribute("type", "hidden");
                        hiddenField.setAttribute("name", key);
                        hiddenField.setAttribute("value", params[key]);

                        form.appendChild(hiddenField);
                    }
                }

                document.body.appendChild(form);
                form.submit();
            }

            //var url = 'WM_AppForm.aspx';
            post(url, postData, 'post');

        }
        function fnRedirectWebLinkCode (url, tit, wlcode) {
            var mtcode = $("#hdMTCode").val();
            var martcode = $("#hdMartCode").val();
            var postDataObject = new Object();
            postDataObject.mtcode = mtcode;
            postDataObject.mart = martcode;
            postDataObject.emp = "1";
            postDataObject.is5duty = "Y";
            postDataObject.wltitle = tit;
            postDataObject.wlcode = wlcode;
            CommonController.fnRedirect(url, postDataObject);
        }
        // [WEBLINK_SEND] RCS 전송창 이동 — AppGoPageEdge.aspx(fromTo=1)로 POST, wlcode/wltitle 포함
        function fnRedirectWebLinkCodeRCS(tit, wlcode) {
            var mtcode = $("#hdMTCode").val();
            var martcode = $("#hdMartCode").val();
            var postDataObject = new Object();
            postDataObject.mtcode = mtcode;
            postDataObject.mart = martcode;
            postDataObject.emp = "1";
            postDataObject.is5duty = "Y";
            postDataObject.fromTo = "1";
            postDataObject.wltitle = tit;
            postDataObject.wlcode = wlcode;
            CommonController.fnRedirect("/Support/AppGoPageEdge.aspx", postDataObject);
        }
        function fnRedirectCloud(url, pm, work) {
            function post(path, params, method) {
                method = method || "post"; // Set method to post by default if not specified.

                // The rest of this code assumes you are not using a library.
                // It can be made less wordy if you use one.
                var form = document.createElement("form");
                form.setAttribute("target", "frmForm");
                form.setAttribute("method", method);
                form.setAttribute("action", path);

                for (var key in params) {
                    if (params.hasOwnProperty(key)) {
                        var hiddenField = document.createElement("input");
                        hiddenField.setAttribute("type", "hidden");
                        hiddenField.setAttribute("name", key);
                        hiddenField.setAttribute("value", params[key]);

                        form.appendChild(hiddenField);
                    }
                }

                document.body.appendChild(form);
                form.submit();
                document.body.removeChild(form);
            }

            var postDataObject = new Object();
            postDataObject.pm = pm;
            //postDataObject.work = 'WEBLINK_TAB';
            postDataObject.work = work;
            post(url, postDataObject, 'post');
        }
    </script>
